<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Claude Code sends each task through nconnect Auto. Jev judges it routine, moderate or hard, and nconnect routes it to DeepSeek V4 Flash 0731, Kimi K2.6 or Kimi K3 on Nebius Token Factory. A stuck task escalates one tier.">
  <style>
    .box { fill: #ffffff; stroke: #d4d8e1; stroke-width: 1.5; }
    .dark { fill: #0a0f1e; }
    .t { fill: #0b1120; font-size: 15px; font-weight: 600; }
    .s { fill: #55607a; font-size: 12.5px; }
    .w { fill: #ffffff; font-size: 15px; font-weight: 600; }
    .ws { fill: #b9c0d4; font-size: 12.5px; }
    .lime { fill: #c6f135; font-size: 12px; font-weight: 700; }
    .line { stroke: #8b95ad; stroke-width: 1.6; fill: none; }
    .esc { stroke: #c2410c; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .esct { fill: #c2410c; font-size: 12px; font-weight: 600; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8b95ad"/></marker>
    <marker id="e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="960" height="400" fill="#f6f7fb"/>

  <rect class="box" x="24" y="160" width="150" height="72" rx="10"/>
  <text class="t" x="99" y="192" text-anchor="middle">Claude Code</text>
  <text class="s" x="99" y="212" text-anchor="middle">one coding task</text>

  <rect class="dark" x="224" y="140" width="190" height="112" rx="12"/>
  <text class="w" x="319" y="176" text-anchor="middle">nconnect Auto</text>
  <text class="ws" x="319" y="198" text-anchor="middle">asks Jev once per prompt,</text>
  <text class="ws" x="319" y="216" text-anchor="middle">keeps the task on its tier</text>
  <text class="lime" x="319" y="238" text-anchor="middle">--model auto</text>

  <rect class="box" x="264" y="22" width="110" height="64" rx="10"/>
  <text class="t" x="319" y="50" text-anchor="middle">Jev</text>
  <text class="s" x="319" y="70" text-anchor="middle">~0.34 s per call</text>
  <path class="line" d="M300 140 V92" marker-end="url(#a)"/>
  <path class="line" d="M338 92 V140" marker-end="url(#a)"/>
  <text class="s" x="252" y="50" text-anchor="end">answers: routine,</text>
  <text class="s" x="252" y="68" text-anchor="end">moderate or hard</text>

  <path class="line" d="M174 196 H218" marker-end="url(#a)"/>

  <text class="s" x="560" y="40" text-anchor="middle" font-weight="600">Nebius Token Factory</text>

  <rect class="box" x="480" y="56" width="300" height="76" rx="10"/>
  <text class="t" x="500" y="86">Fast · DeepSeek V4 Flash 0731</text>
  <text class="s" x="500" y="108">routine · $0.14 / $0.28 per M tokens</text>

  <rect class="box" x="480" y="158" width="300" height="76" rx="10"/>
  <text class="t" x="500" y="188">Balanced · Kimi K2.6</text>
  <text class="s" x="500" y="210">moderate · $0.95 / $4.00 per M tokens</text>

  <rect class="box" x="480" y="260" width="300" height="76" rx="10"/>
  <text class="t" x="500" y="290">Strong · Kimi K3</text>
  <text class="s" x="500" y="312">hard · $3.00 / $15.00 per M tokens</text>

  <path class="line" d="M414 180 C 450 150, 450 94, 474 94" marker-end="url(#a)"/>
  <path class="line" d="M414 196 H474" marker-end="url(#a)"/>
  <path class="line" d="M414 212 C 450 242, 450 298, 474 298" marker-end="url(#a)"/>

  <path class="esc" d="M790 94 C 850 94, 850 196, 790 196" marker-end="url(#e)"/>
  <path class="esc" d="M790 196 C 850 196, 850 298, 790 298" marker-end="url(#e)"/>
  <text class="esct" x="858" y="150">stuck:</text>
  <text class="esct" x="858" y="166">3 failed</text>
  <text class="esct" x="858" y="182">tool calls</text>
  <text class="esct" x="858" y="252">escalate</text>
  <text class="esct" x="858" y="268">one tier</text>

  <text class="s" x="24" y="380">Hidden tests grade every task. Baseline: the same harness with every request on Kimi K3.</text>
</svg>
